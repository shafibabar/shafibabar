<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Shafi Babar</title>
<meta name="description" content="Page not found.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 29,10.5 16,18 3,10.5' fill='%234566f2'/%3E%3Cpolygon points='3,10.5 16,18 16,30 3,22.5' fill='%232447e0'/%3E%3Cpolygon points='29,10.5 16,18 16,30 29,22.5' fill='%2315289a'/%3E%3C/svg%3E">
<!-- Self-contained on purpose: GitHub Pages serves this file at any missing
     path depth, where relative links to css/ would not resolve. -->
<style>
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: light-dark(#0b1220, #e9eef6);
    background:
      radial-gradient(55% 45% at 8% 0%, light-dark(rgba(36,71,224,.2), rgba(62,166,255,.1)), transparent 70%),
      light-dark(#edf1f8, #06080c);
  }
  main { padding: 2rem 1.5rem; max-width: 36rem; }
  .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .12em; color: light-dark(#2447e0, #3ea6ff); margin: 0 0 .5rem; }
  h1 { font-size: 2.4rem; letter-spacing: -.03em; margin: 0 0 1rem; }
  p { color: light-dark(#3b475c, #a3aebf); margin: 0 0 2rem; font-size: 1.15rem; }
  a {
    display: inline-block;
    padding: .75rem 1.5rem;
    border-radius: 10px;
    font-weight: 700;
    text-decoration: none;
    color: light-dark(#fff, #03101c);
    background: linear-gradient(180deg, light-dark(#4566f2, #6cbcff), light-dark(#2447e0, #3597f0));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 5px 0 light-dark(#15289a, #185c9e);
    transition: transform 110ms ease, box-shadow 110ms ease;
  }
  a:active { transform: translateY(4px); box-shadow: 0 1px 0 light-dark(#15289a, #185c9e); }
  a:focus-visible { outline: 3px solid light-dark(#2447e0, #74bdff); outline-offset: 3px; }
</style>
<script>
(function(){var d=document.documentElement,t;try{t=localStorage.getItem("theme")}catch(e){}if(t==="light"||t==="dark")d.setAttribute("data-theme",t)})();
</script>
</head>
<body>
<main>
  <p class="eyebrow">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a id="home-link" href="index.html">Back to home</a>
</main>
<script>
/* On a *.github.io project site the first path segment is the repo name,
   so home is /<repo>/. Elsewhere, fall back to the site root. */
(function(){
  var link = document.getElementById("home-link");
  var seg = location.pathname.split("/")[1];
  var root = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  link.href = new URL(root, location.href).href;
})();
</script>
</body>
</html>
