<main>
  <p class="eyebrow">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a id="home-link" href="index.html">Back to home</a>
</main>
<script>
/* On a *.github.io project site the first path segment is the repo name,
   so home is /<repo>/. Elsewhere, fall back to the site root. */
(function(){
  var link = document.getElementById("home-link");
  var seg = location.pathname.split("/")[1];
  var root = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  link.href = new URL(root, location.href).href;
})();
</script>
